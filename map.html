<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Outfield Fence Overlay — Grünwald Baseballfeld</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 1000; top: 10px; left: 10px;
      background: rgba(20,22,26,.86); color: #f2f4f7; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; line-height: 1.35; max-width: 240px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    .panel h1 { font-size: 14px; margin: 0 0 4px; }
    .panel .sub { color: #aab2bd; font-size: 11px; margin-bottom: 8px; }
    .legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
    .swatch { width: 20px; height: 0; border-top-width: 4px; border-top-style: solid; flex: 0 0 auto; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; border: 2px solid #fff; }
    .leaflet-popup-content { font-size: 13px; }
    .leaflet-popup-content b { display: block; margin-bottom: 3px; }
    .locate-btn {
      background: #fff; width: 34px; height: 34px; line-height: 34px; text-align: center;
      font-size: 18px; cursor: pointer; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Outfield Fence Overlay</h1>
    <div class="sub">Grünwald Baseballfeld · removable-fence arc</div>
    <div class="legend">
      <div><span class="swatch" style="border-top-color:#ff3b30"></span> Operational arc (build this)</div>
      <div><span class="swatch" style="border-top-color:#ff9500;border-top-style:dashed"></span> Senior Tier 1 (ref only)</div>
      <div><span class="swatch" style="border-top-color:#00e5ff;border-top-style:dashed"></span> BBSV U15 (ref only)</div>
      <div><span class="dot" style="background:#ffcc00"></span> Trial pins (5)</div>
      <div><span class="dot" style="background:#e8ecf1;border-color:#2b6cff"></span> Diamond</div>
    </div>
    <div class="sub" style="margin-top:8px">Tap ⌖ to show your GPS position and walk the red line.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { zoomControl: true });

    // Google imagery aligns with the surveyed coordinates (the field was mapped
    // against Google/OSM), so the overlay sits on the dirt cutouts exactly like
    // Google My Maps. Esri World Imagery is offered as an alternative but is
    // georeferenced a couple of metres off here.
    const googleSat = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      subdomains: ['0', '1', '2', '3'], maxZoom: 22, maxNativeZoom: 21,
      attribution: 'Imagery &copy; Google'
    });
    const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      subdomains: ['0', '1', '2', '3'], maxZoom: 22, maxNativeZoom: 21,
      attribution: 'Imagery &copy; Google'
    });
    const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 22, maxNativeZoom: 19,
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
    });
    googleSat.addTo(map);  // default
    L.control.layers({
      'Google Satellite': googleSat,
      'Google Hybrid': googleHybrid,
      'Esri World Imagery': esri
    }).addTo(map);

    const RED = '#ff3b30', ORANGE = '#ff9500', CYAN = '#00e5ff',
          GRAY = '#cfd6df', BLACK = '#111', BLUE = '#2b6cff', YELLOW = '#ffcc00';

    function lineStyle(p) {
      const n = (p.name || '').toLowerCase();
      if (p.folder === 'Outfield arcs') {
        if (n.includes('operational')) return { color: RED, weight: 5, opacity: 1 };
        if (n.includes('tier 1'))      return { color: ORANGE, weight: 3, dashArray: '8,6', opacity: .95 };
        return { color: CYAN, weight: 3, dashArray: '8,6', opacity: .95 };
      }
      if (n.includes('backstop')) return { color: BLACK, weight: 3, opacity: .9 };
      if (p.folder === 'Permanent structures') return { color: BLUE, weight: 2, fillColor: BLUE, fillOpacity: .12 };
      return { color: GRAY, weight: 2, opacity: .8 };            // foul lines
    }

    function pointMarker(feature, latlng) {
      const p = feature.properties, f = p.folder;
      let fill = BLUE, r = 5, stroke = '#fff';
      if (f === 'Trial reference points') { fill = YELLOW; r = 7; }
      else if (f === 'Diamond')           { fill = '#e8ecf1'; stroke = BLUE; }
      else                                 { fill = RED; }        // chalk endpoints
      return L.circleMarker(latlng, { radius: r, fillColor: fill, color: stroke, weight: 2, fillOpacity: 1 });
    }

    function popup(feature, layer) {
      const p = feature.properties;
      if (p.name || p.description)
        layer.bindPopup('<b>' + (p.name || '') + '</b>' + (p.description || ''));
    }

    fetch('data/field-overlay.geojson')
      .then(r => r.json())
      .then(gj => {
        const layer = L.geoJSON(gj, {
          style: f => lineStyle(f.properties),
          pointToLayer: pointMarker,
          onEachFeature: popup
        }).addTo(map);
        map.fitBounds(layer.getBounds(), { padding: [40, 40] });
      })
      .catch(e => { alert('Could not load overlay: ' + e); map.setView([48.0514, 11.5304], 18); });

    // --- live GPS position ("follow the red line" in the field) ---
    let posMarker, accCircle, watching = false;
    const Locate = L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const b = L.DomUtil.create('div', 'leaflet-bar locate-btn');
        b.innerHTML = '⌖'; b.title = 'Show my position';
        L.DomEvent.on(b, 'click', L.DomEvent.stop).on(b, 'click', () => {
          if (watching) return map.locate({ setView: true, maxZoom: 20 });
          watching = true;
          map.locate({ watch: true, enableHighAccuracy: true, setView: true, maxZoom: 20 });
        });
        return b;
      }
    });
    map.addControl(new Locate());
    map.on('locationfound', e => {
      if (!posMarker) {
        posMarker = L.circleMarker(e.latlng, { radius: 7, color: '#fff', weight: 3, fillColor: '#2b6cff', fillOpacity: 1 }).addTo(map);
        accCircle = L.circle(e.latlng, { radius: e.accuracy, color: '#2b6cff', weight: 1, fillOpacity: .08 }).addTo(map);
      } else {
        posMarker.setLatLng(e.latlng);
        accCircle.setLatLng(e.latlng).setRadius(e.accuracy);
      }
    });
    map.on('locationerror', e => alert('Location unavailable: ' + e.message));
  </script>
</body>
</html>
